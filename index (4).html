<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<title>غرفة المذاكرة</title>
<style>
:root{--bg:#f5f4f0;--card:#ffffff;--ink:#15181d;--mute:#6a727d;--line:#e6e4de;--accent:#1d5c48;--accent2:#e7efeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1014;--card:#151a20;--ink:#e8ebee;--mute:#8a94a0;--line:#242b33;--accent:#62b896;--accent2:#1a2a25}}
:root[data-theme="dark"]{--bg:#0d1014;--card:#151a20;--ink:#e8ebee;--mute:#8a94a0;--line:#242b33;--accent:#62b896;--accent2:#1a2a25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}h2{font-size:13px;margin:0 0 12px;color:var(--mute);font-weight:600;letter-spacing:.3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mute);font-size:13px}
.pill{background:var(--accent2);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:#fff;font-weight:600;transition:transform .12s}
button:active{transform:scale(.96)}
button.ghost{background:var(--accent2);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.emojis button{font-size:24px;padding:6px 10px;background:var(--bg);border:2px solid transparent}
.emojis button.on{border-color:var(--accent)}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.ring{position:relative;width:200px;height:200px;margin:6px auto 12px}
.ring svg{transform:rotate(90deg) scaleX(-1)}.emojis{display:none}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font-size:42px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.plot{text-align:center;padding:12px 6px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;gap:4px;justify-items:center}
.bar{width:80%;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.plot .pl{font-size:34px;transition:font-size .6s}
.plot .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plot .sb{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plot.me{border-color:var(--accent)}
.lb{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.lb .av{font-size:22px}.lb .mn{margin-inline-start:auto;font-weight:700;color:var(--accent)}
.msg{text-align:center;font-size:14px;color:var(--accent);min-height:22px;font-weight:600}
.hide{display:none!important}
.avt{display:grid;place-content:center;width:56px;height:56px;border-radius:50%;font-size:24px;font-weight:600;color:#fff;margin:0 auto;background:var(--c)}
.avt.sm{width:40px;height:40px;font-size:22px;margin:0;flex:none}
.chips button{background:var(--bg);color:var(--ink);padding:6px 11px;font-size:13px;border:2px solid transparent}.chips button.on{border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;background:var(--accent2);color:var(--accent);border-radius:99px;padding:1px 9px;margin-top:2px}
.plot{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{width:100%;max-width:340px;text-align:center}
.ov .row{justify-content:center;margin-top:10px}
.feed{max-height:180px;overflow:auto;display:grid;gap:6px;margin-bottom:10px;font-size:14px}
.feed div{background:var(--bg);border-radius:10px;padding:6px 10px}
.feed .ev{color:var(--accent);font-weight:600}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.join{background:var(--accent2);border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1><span id="gname">غرفة المذاكرة</span></h1><div class="sub">جلسات مذاكرة مشتركة، وكل دقيقة تركيز بتتحسب للجروب</div></div>
    <span class="pill" id="online">أنت هنا</span>
  </div>

  <section class="card" id="setup">
    <h2>ملفك الشخصي</h2>
    <input type="text" id="name" maxlength="14" placeholder="اسمك أو لقبك">
    <div class="row emojis" id="emojis" style="margin:12px 0 8px"></div>
    <div class="row colors" id="colors" style="margin-bottom:12px"></div>
    <div class="row chips" id="titles" style="margin-bottom:12px"></div>
    <input type="text" id="motto" maxlength="40" placeholder="جملتك المفضلة (مثلاً: لسه بدري على النوم)" style="margin-bottom:14px">
    <button id="save">ابدأ</button>
  </section>

  <section class="card hide" id="app">
    <div class="top" style="margin-bottom:6px">
      <div><b id="meName"></b> <span class="sub" id="meTot"></span></div>
      <button class="ghost" id="edit" style="padding:6px 12px">تعديل</button>
    </div>
    <input type="text" id="subject" maxlength="20" placeholder="بتذاكر إيه دلوقتي؟">
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg>
      <div class="t"><b id="clock">25:00</b><span class="sub" id="state">جاهز</span></div>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:10px" id="lens">
      <button class="ghost" data-m="15">15</button><button class="ghost" data-m="25">25</button><button class="ghost" data-m="45">45</button>
    </div>
    <div class="row" style="justify-content:center"><button id="go">ابدأ التركيز</button><button class="ghost hide" id="stop">وقّف</button></div>
    <div class="msg" id="msg"></div>
  </section>

  <div class="join hide" id="join"><span id="joinTx"></span><button id="joinBtn" style="padding:7px 14px">انضم</button></div>
  <section class="card"><h2>الحضور الآن <span class="sub" id="gtot"></span></h2><div class="garden" id="garden"></div></section>
  <section class="card"><h2>ترتيب اليوم</h2><ol class="lb" id="lb"></ol></section>
  <section class="card"><h2>قعدة الجروب</h2><div class="feed" id="feed"><div class="sub">اضغط على أي عضو لتشجيعه، أو اكتب هنا لكل الجروب</div></div><div class="row" style="flex-wrap:nowrap"><input type="text" id="chat" maxlength="80" placeholder="اكتب رسالة..."><button id="send">ابعت</button></div></section>
</main>
<div class="ov hide" id="ov"><div class="card" id="ovc"></div></div>
<div class="toast hide" id="toast"></div>
