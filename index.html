<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<title>غرفة المذاكرة</title>
<style>
:root{--bg:#f5f4f0;--card:#ffffff;--ink:#15181d;--mute:#6a727d;--line:#e6e4de;--accent:#1d5c48;--accent2:#e7efeb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1014;--card:#151a20;--ink:#e8ebee;--mute:#8a94a0;--line:#242b33;--accent:#62b896;--accent2:#1a2a25}}
:root[data-theme="dark"]{--bg:#0d1014;--card:#151a20;--ink:#e8ebee;--mute:#8a94a0;--line:#242b33;--accent:#62b896;--accent2:#1a2a25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:16px 14px 40px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.2px}h2{font-size:13px;margin:0 0 12px;color:var(--mute);font-weight:600;letter-spacing:.3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sub{color:var(--mute);font-size:13px}
.pill{background:var(--accent2);color:var(--accent);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:#fff;font-weight:600;transition:transform .12s}
button:active{transform:scale(.96)}
button.ghost{background:var(--accent2);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.emojis button{font-size:24px;padding:6px 10px;background:var(--bg);border:2px solid transparent}
.emojis button.on{border-color:var(--accent)}
.colors button{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}
.colors button.on{border-color:var(--ink)}
.ring{position:relative;width:200px;height:200px;margin:6px auto 12px}
.ring svg{transform:rotate(90deg) scaleX(-1)}.emojis{display:none}
.ring .t{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .t b{font-size:42px;font-variant-numeric:tabular-nums;letter-spacing:1px}
.garden{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.plot{text-align:center;padding:12px 6px 10px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;gap:4px;justify-items:center}
.bar{width:80%;height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width 1s linear}
.plot .pl{font-size:34px;transition:font-size .6s}
.plot .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plot .sb{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plot.me{border-color:var(--accent)}
.lb{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lb li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--bg)}
.lb .av{font-size:22px}.lb .mn{margin-inline-start:auto;font-weight:700;color:var(--accent)}
.msg{text-align:center;font-size:14px;color:var(--accent);min-height:22px;font-weight:600}
.hide{display:none!important}
.avt{display:grid;place-content:center;width:56px;height:56px;border-radius:50%;font-size:24px;font-weight:600;color:#fff;margin:0 auto;background:var(--c)}
.avt.sm{width:40px;height:40px;font-size:22px;margin:0;flex:none}
.chips button{background:var(--bg);color:var(--ink);padding:6px 11px;font-size:13px;border:2px solid transparent}.chips button.on{border-color:var(--accent)}
.tag{display:inline-block;font-size:11px;background:var(--accent2);color:var(--accent);border-radius:99px;padding:1px 9px;margin-top:2px}
.plot{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{width:100%;max-width:340px;text-align:center}
.ov .row{justify-content:center;margin-top:10px}
.feed{max-height:180px;overflow:auto;display:grid;gap:6px;margin-bottom:10px;font-size:14px}
.feed div{background:var(--bg);border-radius:10px;padding:6px 10px}
.feed .ev{color:var(--accent);font-weight:600}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.join{background:var(--accent2);border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1><span id="gname">غرفة المذاكرة</span></h1><div class="sub">جلسات مذاكرة مشتركة، وكل دقيقة تركيز بتتحسب للجروب</div></div>
    <span class="pill" id="online">أنت هنا</span>
  </div>

  <section class="card" id="setup">
    <h2>ملفك الشخصي</h2>
    <input type="text" id="name" maxlength="14" placeholder="اسمك أو لقبك">
    <div class="row emojis" id="emojis" style="margin:12px 0 8px"></div>
    <div class="row colors" id="colors" style="margin-bottom:12px"></div>
    <div class="row chips" id="titles" style="margin-bottom:12px"></div>
    <input type="text" id="motto" maxlength="40" placeholder="جملتك المفضلة (مثلاً: لسه بدري على النوم)" style="margin-bottom:14px">
    <button id="save">ابدأ</button>
  </section>

  <section class="card hide" id="app">
    <div class="top" style="margin-bottom:6px">
      <div><b id="meName"></b> <span class="sub" id="meTot"></span></div>
      <button class="ghost" id="edit" style="padding:6px 12px">تعديل</button>
    </div>
    <input type="text" id="subject" maxlength="20" placeholder="بتذاكر إيه دلوقتي؟">
    <div class="ring">
      <svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="arc" cx="100" cy="100" r="90" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="565.5" stroke-dashoffset="0"/></svg>
      <div class="t"><b id="clock">25:00</b><span class="sub" id="state">جاهز</span></div>
    </div>
    <div class="row" style="justify-content:center;margin-bottom:10px" id="lens">
      <button class="ghost" data-m="15">15</button><button class="ghost" data-m="25">25</button><button class="ghost" data-m="45">45</button>
    </div>
    <div class="row" style="justify-content:center"><button id="go">ابدأ التركيز</button><button class="ghost hide" id="stop">وقّف</button></div>
    <div class="msg" id="msg"></div>
  </section>

  <div class="join hide" id="join"><span id="joinTx"></span><button id="joinBtn" style="padding:7px 14px">انضم</button></div>
  <section class="card"><h2>الحضور الآن <span class="sub" id="gtot"></span></h2><div class="garden" id="garden"></div></section>
  <section class="card"><h2>ترتيب اليوم</h2><ol class="lb" id="lb"></ol></section>
  <section class="card"><h2>قعدة الجروب</h2><div class="feed" id="feed"><div class="sub">اضغط على أي عضو لتشجيعه، أو اكتب هنا لكل الجروب</div></div><div class="row" style="flex-wrap:nowrap"><input type="text" id="chat" maxlength="80" placeholder="اكتب رسالة..."><button id="send">ابعت</button></div></section>
</main>
<div class="ov hide" id="ov"><div class="card" id="ovc"></div></div>
<div class="toast hide" id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase, ref, set, push as dbPush, onValue, onChildAdded, onDisconnect, query, limitToLast} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyAghskSL3RkmfzQF_ZsUBHO91wbKvRTcJU",
  authDomain: "study-room34.firebaseapp.com",
  databaseURL: "https://study-room34-default-rtdb.firebaseio.com",
  projectId: "study-room34",
  storageBucket: "study-room34.firebasestorage.app",
  messagingSenderId: "648420659251",
  appId: "1:648420659251:web:0aa97d1face77440e05346"
};
const fb = getDatabase(initializeApp(firebaseConfig));
const myId = "u" + Math.random().toString(36).slice(2, 12);
const loadedAt = Date.now();
const GROUP_NAME = "غرفة المذاكرة";
const EMOJIS = [];
const ini = n => [...String(n).trim()][0] || "•";
const COLORS = ["#1d5c48","#2f6f8f","#4b5fa8","#7a5aa6","#a64b6b","#b8602f","#8a7a2a","#4a5560"];
const $ = id => document.getElementById(id);
$("gname").textContent = GROUP_NAME;
const today = () => new Date().toISOString().slice(0,10);
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

let me = load("sr_me", null); if(me) me.e = ini(me.n);
let tot = load("sr_tot", {day:today(), min:0});
if(tot.day !== today()) tot = {day:today(), min:0};
let st = {mode:"idle", t0:0, d:0}, len = 25, peers = [], room = null, myPeer = null;

// setup
const TITLES = ["من أهل الفجر","سهران الليل","المنظّم","الهادئ","المثابر","روح الجروب"];
let life = load("sr_life", 0);
let pick = {e:"", c: me ? me.c : COLORS[0], t: me ? me.t : TITLES[0]};
function drawPicks(){
  $("emojis").innerHTML = ""; $("colors").innerHTML = "";
  EMOJIS.forEach(e => { const b = document.createElement("button"); b.textContent = e; b.className = e===pick.e?"on":""; b.onclick = () => {pick.e = e; drawPicks();}; $("emojis").appendChild(b); });
  COLORS.forEach(c => { const b = document.createElement("button"); b.style.background = c; b.className = c===pick.c?"on":""; b.onclick = () => {pick.c = c; drawPicks();}; $("colors").appendChild(b); });
  $("titles").innerHTML = "";
  TITLES.forEach(t => { const b = document.createElement("button"); b.textContent = t; b.className = t===pick.t?"on":""; b.onclick = () => {pick.t = t; drawPicks();}; $("titles").appendChild(b); });
}
drawPicks();
if(me) $("motto").value = me.b || "";
if(me) $("name").value = me.n;
$("save").onclick = () => {
  const n = $("name").value.trim(); if(!n){ $("name").focus(); return; }
  me = {n, e:ini(n), c:pick.c, t:pick.t, b:$("motto").value.trim()}; save("sr_me", me); showApp(); push();
};
$("edit").onclick = () => { $("setup").classList.remove("hide"); $("app").classList.add("hide"); };
function showApp(){
  $("setup").classList.add("hide"); $("app").classList.remove("hide");
  $("meName").textContent = me.n; render();
}
if(me) showApp();

// timer
document.querySelectorAll("#lens button").forEach(b => b.onclick = () => { if(st.mode==="idle"){ len = +b.dataset.m; render(); } });
$("go").onclick = () => { st = {mode:"focus", t0:Date.now(), d:len*60000}; $("msg").textContent = ""; push(); render(); };
$("stop").onclick = () => {
  if(st.mode==="focus"){ const m = Math.floor((Date.now()-st.t0)/60000); if(m>0) addMin(m); }
  st = {mode:"idle", t0:0, d:0}; push(); render();
};
function addMin(m){ tot.min += m; life += m; save("sr_tot", tot); save("sr_life", life); push(); }
const lvl = m => m<60?"مبتدئ":m<300?"ثابت":m<900?"متقدم":"محترف";
const LINES = ["جلسة ممتازة، أضفتها للجروب","شغل عالي، خد نفس","أحسنت، استراحة تستاهلها","كمّل بنفس الهمة"];
function finish(){
  if(st.mode==="focus"){
    addMin(Math.round(st.d/60000));
    $("msg").textContent = LINES[Math.floor(Math.random()*LINES.length)];
    st = {mode:"break", t0:Date.now(), d:5*60000};
    try{ navigator.vibrate && navigator.vibrate(200); }catch(e){}
  } else { st = {mode:"idle", t0:0, d:0}; }
  push(); render();
}
setInterval(() => { if(st.mode!=="idle" && Date.now()-st.t0 >= st.d) finish(); render(); }, 1000);

// room
function push(){
  if(!room || !me) return;
  set(ref(fb, "presence/"+myId), {t:me.t||"", b:me.b||"", life, n:me.n, e:me.e, c:me.c, s:$("subject").value.slice(0,20), m:st.mode, t0:st.t0, d:st.d, tot:tot.min, day:tot.day, ts:Date.now()}).catch(()=>{});
}
$("subject").addEventListener("change", push);
try{
  room = { emit:(k, data) => dbPush(ref(fb, "events"), Object.assign({k, ts:Date.now()}, data)) };
  myPeer = myId;
  onValue(ref(fb, ".info/connected"), snap => { if(snap.val()){ onDisconnect(ref(fb, "presence/"+myId)).remove(); push(); } });
  onValue(ref(fb, "presence"), snap => {
    const v = snap.val() || {}, now = Date.now();
    peers = Object.keys(v).filter(id => v[id] && v[id].n && now - (v[id].ts||0) < 90000).map(id => ({peer:id, isMe:id===myId, presence:v[id]}));
    render();
  });
  onChildAdded(query(ref(fb, "events"), limitToLast(40)), snap => {
    const d = snap.val(); if(!d) return;
    if(d.k==="cheer"){ line(d.n+" ← "+d.tn+": "+d.l, true); if(d.to===myId && d.ts>loadedAt) toast(d.n+" بعتلك: "+d.l); }
    else if(d.k==="chat" && d.t) line(d.n+": "+d.t, false);
  });
  setInterval(push, 30000);
}catch(e){ room = null; }

const fmt = ms => { const s = Math.max(0, Math.ceil(ms/1000)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
function plant(p, now){
  const m = p.m;
  if(m==="focus"){ const f = (now-p.t0)/p.d; return f<.33?"🌱":f<.66?"🌿":"🌳"; }
  if(m==="break") return "🍎";
  return "🌰";
}
function minutesOf(p, now){
  let t = p.day===today() ? (p.tot||0) : 0;
  if(p.m==="focus") t += Math.floor((now-p.t0)/60000);
  return t;
}
function render(){
  const now = Date.now();
  if(me){
    const left = st.mode==="idle" ? len*60000 : st.d-(now-st.t0);
    $("clock").textContent = fmt(left);
    $("state").textContent = st.mode==="focus"?"تركيز":st.mode==="break"?"استراحة":"جاهز";
    $("arc").style.strokeDashoffset = st.mode==="idle" ? 0 : 565.5*((now-st.t0)/st.d);
    $("go").classList.toggle("hide", st.mode!=="idle"); $("stop").classList.toggle("hide", st.mode==="idle");
    $("stop").textContent = st.mode==="break" ? "كفاية راحة" : "وقّف";
    document.querySelectorAll("#lens button").forEach(b => b.style.opacity = (st.mode==="idle" && +b.dataset.m===len) ? 1 : .5);
    $("meTot").textContent = "· النهارده " + (tot.min + (st.mode==="focus"?Math.floor((now-st.t0)/60000):0)) + " دقيقة";
  }
  const all = [];
  if(me) all.push({n:me.n,e:me.e,c:me.c,s:$("subject").value,m:st.mode,t0:st.t0,d:st.d,tot:tot.min,day:tot.day,me:true});
  peers.forEach(p => { if(!p.isMe) all.push(Object.assign({}, p.presence, {peer:p.peer})); });
  all.forEach(p => { if(p.me){ p.t = me.t; p.b = me.b; p.life = life; } });
  const f = all.find(p => !p.me && p.m==="focus" && now-p.t0 < p.d-60000);
  const jb = $("join"); if(f && me && st.mode==="idle"){ jb.classList.remove("hide"); $("joinTx").textContent = f.n+" بدأ يذاكر دلوقتي"; jb.dataset.t0 = f.t0; jb.dataset.d = f.d; } else jb.classList.add("hide");
  $("online").textContent = all.length>1 ? all.length+" متصلين الآن" : "أنت هنا";
  const g = $("garden"); g.innerHTML = "";
  all.forEach(p => {
    const d = document.createElement("div"); d.className = "plot"+(p.me?" me":""); d.style.setProperty("--c", p.c||"transparent");
    d.onclick = () => openCard(p);
    const a = document.createElement("div"); a.className = "avt"; a.style.setProperty("--c", p.c||"#4a5560"); a.textContent = p.e||ini(p.n);
    const b = document.createElement("div"); b.className = "nm"; b.textContent = p.n;
    const c = document.createElement("div"); c.className = "sb"; c.textContent = p.m==="focus" ? (p.s||"بيذاكر") : p.m==="break" ? "استراحة" : "متاح";
    const br = document.createElement("div"); br.className = "bar"; const bi = document.createElement("i");
    bi.style.width = (p.m==="focus" ? Math.min(100,(now-p.t0)/p.d*100) : p.m==="break" ? 100 : 0)+"%"; br.appendChild(bi);
    d.append(a,b,c,br); g.appendChild(d);
  });
  if(!all.length){ g.innerHTML = '<div class="sub">اعمل ملفك وابدأ</div>'; }
  const sorted = all.map(p => ({p, t:minutesOf(p, now)})).sort((x,y) => y.t-x.t);
  const sum = sorted.reduce((s,x) => s+x.t, 0);
  $("gtot").textContent = sum ? "· "+sum+" دقيقة مع بعض" : "";
  const lb = $("lb"); lb.innerHTML = "";
  const medals = ["١","٢","٣"];
  sorted.forEach((x,i) => {
    const li = document.createElement("li");
    const av = document.createElement("span"); av.className = "avt sm"; av.style.setProperty("--c", x.p.c || "#3f8f5f"); av.textContent = x.p.e || ini(x.p.n);
    const md = document.createElement("span"); md.className = "av"; md.textContent = medals[i] || "";
    const nm = document.createElement("span"); nm.textContent = x.p.n + (x.p.me?" (أنت)":"");
    const mn = document.createElement("span"); mn.className = "mn"; mn.textContent = x.t+" د";
    li.append(av,nm,md,mn); lb.appendChild(li);
  });
}
function toast(t){ const el = $("toast"); el.textContent = t; el.classList.remove("hide"); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.add("hide"), 3500); }
function line(t, ev){ const f = $("feed"); if(f.firstChild && f.firstChild.className==="sub") f.innerHTML = ""; const d = document.createElement("div"); if(ev) d.className = "ev"; d.textContent = t; f.appendChild(d); f.scrollTop = f.scrollHeight; while(f.children.length>40) f.removeChild(f.firstChild); }
const CHEERS = [["","أحسنت"],["","كمّل"],["","قهوة؟"],["","شد حيلك"]];
function openCard(p){
  const c = $("ovc"); c.innerHTML = "";
  const a = document.createElement("div"); a.className = "avt"; a.style.setProperty("--c", p.c||"#3f8f5f"); a.textContent = p.e||ini(p.n);
  const n = document.createElement("h1"); n.style.marginTop = "10px"; n.textContent = p.n;
  const t = document.createElement("div"); t.className = "tag"; t.textContent = (p.t||"")+" · "+lvl((p.life||0));
  const b = document.createElement("p"); b.className = "sub"; b.textContent = p.b ? "\u201c"+p.b+"\u201d" : "";
  const s = document.createElement("div"); s.className = "sub"; s.textContent = "النهارده "+minutesOf(p, Date.now())+" دقيقة · إجمالي "+(p.life||0)+" دقيقة";
  c.append(a,n,t,b,s);
  if(!p.me){
    const r = document.createElement("div"); r.className = "row";
    CHEERS.forEach(([em,l]) => { const k = document.createElement("button"); k.className = "ghost"; k.textContent = l; k.onclick = () => { if(room && me) room.emit("cheer", {to:p.peer, tn:p.n, n:me.n, e:me.e, l:l}).catch(()=>{}); $("ov").classList.add("hide"); toast("اتبعتت"); }; r.appendChild(k); });
    c.appendChild(r);
  }
  const x = document.createElement("button"); x.className = "ghost"; x.style.marginTop = "12px"; x.textContent = "إغلاق"; x.onclick = () => $("ov").classList.add("hide");
  c.appendChild(x); $("ov").classList.remove("hide");
}
$("ov").onclick = e => { if(e.target===$("ov")) $("ov").classList.add("hide"); };
$("joinBtn").onclick = () => { const j = $("join"); st = {mode:"focus", t0:+j.dataset.t0, d:+j.dataset.d}; push(); render(); };
function sendChat(){ const v = $("chat").value.trim(); if(!v || !me) return; if(room) room.emit("chat", {n:me.n, e:me.e, t:v}).catch(()=>{}); else line(me.n+": "+v, false); $("chat").value = ""; }
$("send").onclick = sendChat;
$("chat").addEventListener("keydown", e => { if(e.key==="Enter") sendChat(); });
render();
</script>
</body>
</html>
