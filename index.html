<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>غرفة المذاكرة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5efe3;--card:#fffcf5;--ink:#22372b;--mut:#6b7a6f;--g:#2f6b4f;--g2:#dbe8dc;--gold:#c79a46;--line:#e6dcc8;--red:#b5483a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
.hide{display:none!important}
button{font:inherit;cursor:pointer}
input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{font-weight:800;font-size:1.2rem;color:var(--g);margin-inline-end:auto}
.pill{font-size:.8rem;padding:2px 10px;border-radius:99px;background:var(--g2);color:var(--g)}
.pill.off{background:#eee4cf;color:#8a6d2b}.pill.err{background:#f4d9d4;color:var(--red)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 12px;color:var(--ink)}
main{display:grid;grid-template-columns:1fr;gap:16px;max-width:1100px;margin:0 auto;padding:16px}
@media(min-width:900px){main{grid-template-columns:1fr 1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 2px 10px #5a4a2a12}
h2{margin:0 0 10px;font-size:1.05rem;color:var(--g)}
.btn{background:var(--g);color:#fff;border:0;border-radius:12px;padding:8px 22px;font-weight:600}
.btn.red{background:var(--red)}.btn:disabled{opacity:.5}
.timer{text-align:center}
#modes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
#modes button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:3px 14px;color:var(--ink)}
#modes button.on{background:var(--g);color:#fff;border-color:var(--g)}
#modes button:disabled{opacity:.55;cursor:default}
.ringw{position:relative;width:220px;height:220px;margin:6px auto}
.ringw svg{transform:rotate(-90deg)}
.ringw .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#clock{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
#state{color:var(--mut)}
#subj,#nick,#msg{width:100%;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:1.25rem}.stat small{color:var(--mut)}
.bar{height:10px;background:var(--g2);border-radius:9px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}.row.me{background:var(--g2);border-radius:10px}
.cheer{background:none;border:1px solid var(--line);border-radius:10px;padding:0 8px}
.tabs{display:flex;gap:6px;margin-bottom:6px}.tabs button{border:0;background:none;padding:2px 10px;border-radius:99px;color:var(--mut)}
.tabs button.on{background:var(--g2);color:var(--g);font-weight:600}
.empty{color:var(--mut);text-align:center;padding:10px}
#chat{height:220px;overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.m{margin:2px 0}.m b{color:var(--g)}.m.sys{color:var(--mut);font-size:.9rem}
.sendw{display:flex;gap:8px;align-items:center}.sendw #msg{margin:8px 0}
#toast{position:fixed;bottom:16px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20}
#toast div{background:var(--ink);color:#fff;padding:8px 18px;border-radius:12px;box-shadow:0 4px 14px #0003}
.ov{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.ov .card{max-width:380px;width:100%;text-align:center}
#emojis{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0}
#emojis button{font-size:1.5rem;border:2px solid transparent;background:#fff;border-radius:12px}
#emojis button.on{border-color:var(--g);background:var(--g2)}
#regErr{color:var(--red);min-height:1.5em;margin:4px 0}
</style>
</head>
<body>
<div id="reg" class="ov"><div class="card">
  <h1 style="margin:0;color:var(--g)">📚 غرفة المذاكرة</h1>
  <p style="color:var(--mut)">اختر اسماً مستعاراً وأيقونة وابدأ المذاكرة مع الجميع</p>
  <input id="nick" maxlength="14" placeholder="اسمك المستعار" autocomplete="off">
  <div id="emojis"></div>
  <div id="regErr"></div>
  <button id="enter" class="btn" style="width:100%">ادخل الغرفة</button>
</div></div>

<header class="hide" id="top">
  <span class="logo">📚 غرفة المذاكرة</span>
  <span id="cnt" class="pill">0 متصل</span>
  <span id="pill" class="pill off">جارٍ الاتصال…</span>
  <button id="who" class="ghost" title="تغيير الاسم"></button>
</header>

<main id="app" class="hide">
  <div class="col">
    <section class="card timer">
      <div id="modes"></div>
      <div class="ringw">
        <svg width="220" height="220" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="96" fill="none" stroke="#dbe8dc" stroke-width="14"/>
          <circle id="arc" cx="110" cy="110" r="96" fill="none" stroke="#2f6b4f" stroke-width="14" stroke-linecap="round" stroke-dasharray="603.2" stroke-dashoffset="0"/>
        </svg>
        <div class="mid"><div id="clock">25:00</div><div id="state">جاهز</div></div>
      </div>
      <input id="subj" maxlength="20" placeholder="بتذاكر إيه؟ (اختياري)" autocomplete="off">
      <button id="go" class="btn">ابدأ</button>
      <button id="stop" class="btn red hide">إيقاف</button>
    </section>
    <section class="card"><h2>إحصائياتك</h2><div id="stats"></div></section>
    <section class="card"><h2>تحديات اليوم</h2><div id="chal"></div></section>
  </div>
  <div class="col">
    <section class="card"><h2>في الغرفة الآن</h2><div id="room"></div></section>
    <section class="card"><h2>المتصدرون</h2>
      <div class="tabs" id="tabs"><button data-t="today" class="on">اليوم</button><button data-t="all">الإجمالي</button></div>
      <div id="lb"></div></section>
    <section class="card"><h2>الدردشة</h2><div id="chat"></div>
      <div class="sendw"><input id="msg" maxlength="80" placeholder="اكتب رسالة…" autocomplete="off"><button id="send" class="btn">إرسال</button></div></section>
  </div>
</main>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function(){
"use strict";
var CFG={apiKey:"AIzaSyAghskSL3RkmfzQF_ZsUBHO91wbKvRTcJU",authDomain:"study-room34.firebaseapp.com",databaseURL:"https://study-room34-default-rtdb.firebaseio.com",projectId:"study-room34",storageBucket:"study-room34.firebasestorage.app",messagingSenderId:"648420659251",appId:"1:648420659251:web:0aa97d1face77440e05346"};
var $=function(id){return document.getElementById(id)};
function h(t,a){var e=document.createElement(t);a=a||{};for(var k in a){if(k==="class")e.className=a[k];else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k])}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c!=null&&c!==false)e.append(c)}return e}
var ls={get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function dayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mmss(ms){var s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function toast(t){var d=h("div",{},t);$("toast").append(d);setTimeout(function(){d.remove()},3800)}

/* ---------- الحالة ---------- */
var EMOJIS=["🦉","📚","🌿","☕","🎯","🌙","🔥","🦊","🐼","🌻","🚀","🧠"];
var MODES=[["focus",25],["focus",45],["focus",60],["break",5],["break",10]];
var CH=[
 {id:"a",t:"ذاكر 60 دقيقة اليوم",pts:20,prog:function(p){return[Math.min(p.dmin,60),60]},test:function(p){return p.dmin>=60}},
 {id:"b",t:"أنهِ 3 جلسات تركيز",pts:15,prog:function(p){return[Math.min(p.dses,3),3]},test:function(p){return p.dses>=3}},
 {id:"c",t:"جلسة تركيز 45 دقيقة أو أكثر",pts:15,prog:null,test:function(p,done,dur){return done&&dur>=45}}
];
var me=ls.get("sr2_me",null);
var prof={pts:0,tot:0,ses:0,day:"",dmin:0,dses:0,str:0,ld:"",ch:""};
var timer=ls.get("sr2_timer",null);
var sel={m:"focus",dur:25};
var db=null,off=0,online=false,errMsg="";
var peers={},lb=[],lbTab="today",roomSig="",lastSend=0,lastCheer=0;
var readyRes,ready=new Promise(function(r){readyRes=r});
var C=603.2;

function now(){return Date.now()+off}
function pill(){
  var p=$("pill");
  if(errMsg){p.className="pill err";p.textContent="خطأ: "+errMsg}
  else if(online){p.className="pill";p.textContent="متصل"}
  else{p.className="pill off";p.textContent="غير متصل"}
}
function fail(e){errMsg=String((e&&(e.code||e.message))||e).slice(0,60);pill()}

/* ---------- التسجيل ---------- */
(function(){
  var chosen=EMOJIS[0],box=$("emojis");
  EMOJIS.forEach(function(e){var b=h("button",{type:"button",class:e===chosen?"on":"",onclick:function(){chosen=e;[].forEach.call(box.children,function(x){x.classList.toggle("on",x===b)})}},e);box.append(b)});
  function enter(){
    var n=$("nick").value.trim().replace(/\s+/g," ");
    if(n.length<2){$("regErr").textContent="الاسم لازم حرفين على الأقل";return}
    var a=new Uint8Array(6);try{crypto.getRandomValues(a)}catch(e){for(var i=0;i<6;i++)a[i]=Math.random()*256}
    me={id:"u"+[].map.call(a,function(x){return x.toString(16).padStart(2,"0")}).join(""),n:n,e:chosen};
    ls.set("sr2_me",me);boot();
  }
  $("enter").addEventListener("click",enter);
  $("nick").addEventListener("keydown",function(e){if(e.key==="Enter")enter()});
})();

/* ---------- المؤقت ---------- */
function startTimer(){
  if(timer)return;
  timer={m:sel.m,dur:sel.dur,end:Date.now()+sel.dur*60000,subj:$("subj").value.trim().slice(0,20)};
  ls.set("sr2_timer",timer);beat();renderTimer();
}
function stopTimer(){
  if(!timer)return;
  var t=timer;timer=null;ls.set("sr2_timer",null);
  if(t.m==="focus"){
    var el=Math.floor((Date.now()-(t.end-t.dur*60000))/60000);
    if(el>=5)award(Math.min(el,t.dur),false,t.dur);
  }
  beat();renderTimer();
}
function tick(){
  if(timer&&Date.now()>=timer.end){
    var t=timer;timer=null;ls.set("sr2_timer",null);
    if(t.m==="focus")award(t.dur,true,t.dur);else toast("خلصت الاستراحة ☕ ابدأ جلسة تركيز");
    beat();
  }
  renderTimer();
  var n=now();
  [].forEach.call(document.querySelectorAll("[data-end]"),function(s){s.textContent=mmss(+s.dataset.end-n)});
}
function renderTimer(){
  var run=!!timer,total=(run?timer.dur:sel.dur)*60000,left=run?Math.max(0,timer.end-Date.now()):total;
  var m=run?timer.m:sel.m;
  $("clock").textContent=mmss(left);
  $("arc").style.strokeDashoffset=String(C*(1-left/total));
  $("arc").style.stroke=m==="break"?"#c79a46":"#2f6b4f";
  $("state").textContent=run?(m==="focus"?"تركيز 🎯":"استراحة ☕"):"جاهز";
  $("go").classList.toggle("hide",run);$("stop").classList.toggle("hide",!run);
  $("subj").disabled=run;
  document.title=(run?mmss(left)+" • ":"")+"غرفة المذاكرة";
  [].forEach.call($("modes").children,function(b){
    b.disabled=run;
    b.classList.toggle("on",b.dataset.m===m&&+b.dataset.d===(run?timer.dur:sel.dur));
  });
}

/* ---------- النقاط والتحديات والتتابع ---------- */
async function award(min,done,dur){
  await ready;
  var today=dayKey();
  if(prof.day!==today){prof.day=today;prof.dmin=0;prof.dses=0;prof.ch=""}
  prof.dmin+=min;prof.tot+=min;
  var gain=min;
  if(done){
    prof.dses++;prof.ses++;
    if(prof.ld!==today){var y=new Date();y.setDate(y.getDate()-1);prof.str=prof.ld===dayKey(y)?prof.str+1:1;prof.ld=today}
    gain+=5+Math.min(prof.str,10);
  }
  var got=prof.ch?prof.ch.split(","):[],won=[];
  CH.forEach(function(c){if(got.indexOf(c.id)<0&&c.test(prof,done,dur)){got.push(c.id);gain+=c.pts;won.push(c.t)}});
  prof.ch=got.join(",");prof.pts+=gain;
  save();renderStats();
  toast((done?"أحسنت! ":"تم تسجيل جلستك. ")+"+"+gain+" نقطة ⭐");
  won.forEach(function(t){toast("🏆 أنجزت تحدي: "+t)});
}
function save(){
  if(!db||!me)return;
  db.ref("users/"+me.id).set({n:me.n,e:me.e,pts:prof.pts,tot:prof.tot,ses:prof.ses,day:prof.day,dmin:prof.dmin,dses:prof.dses,str:prof.str,ld:prof.ld,ch:prof.ch}).catch(fail);
}
function view(){
  var t=dayKey(),y=new Date();y.setDate(y.getDate()-1);
  var today=prof.day===t;
  return{dm:today?prof.dmin:0,ds:today?prof.dses:0,got:today&&prof.ch?prof.ch.split(","):[],str:(prof.ld===t||prof.ld===dayKey(y))?prof.str:0};
}
function stat(i,v,s){return h("div",{class:"stat"},h("b",{},i+" "+v),h("small",{},s))}
function renderStats(){
  var v=view(),lv=Math.floor(Math.sqrt(prof.pts/40))+1,lo=40*(lv-1)*(lv-1),hi=40*lv*lv,pr=Math.round((prof.pts-lo)/(hi-lo)*100);
  var goal=Math.min(100,Math.round(v.dm/120*100));
  $("stats").replaceChildren(
    h("div",{class:"stats"},stat("⭐",prof.pts,"نقطة"),stat("🏅","مستوى "+lv,pr+"% للمستوى التالي"),stat("🔥",v.str,"يوم متتالي"),stat("⏱",v.dm+" د","اليوم (الهدف 120)")),
    h("div",{class:"bar"},h("i",{style:"width:"+goal+"%"})));
  $("chal").replaceChildren.apply($("chal"),CH.map(function(c){
    var done=v.got.indexOf(c.id)>=0,p=c.prog?c.prog(prof.day===dayKey()?prof:{dmin:0,dses:0}):null;
    return h("div",{class:"row"},h("span",{},done?"✅":"⬜"),h("span",{class:"nm"},c.t),h("small",{},done?"تم":(p?p[0]+"/"+p[1]+" · ":"")+"+"+c.pts));
  }));
}

/* ---------- الغرفة والمتصدرون ---------- */
function fresh(){
  var t=now(),o=[];
  for(var id in peers){var p=peers[id];if(p&&t-(p.ts||0)<60000){o.push(Object.assign({id:id},p))}}
  return o.sort(function(a,b){return (b.m==="focus")-(a.m==="focus")});
}
function renderRoom(){
  var list=fresh();
  $("cnt").textContent=list.length+" متصل";
  var sig=list.map(function(p){return[p.id,p.n,p.e,p.m,p.subj,p.end].join("|")}).join(";");
  if(sig===roomSig)return;roomSig=sig;
  if(!list.length){$("room").replaceChildren(h("div",{class:"empty"},"مفيش حد متصل دلوقتي"));return}
  $("room").replaceChildren.apply($("room"),list.map(function(p){
    var isMe=me&&p.id===me.id,st;
    if(p.m==="idle"||!p.end)st=h("small",{},"متاح");
    else st=h("small",{},(p.m==="focus"?"🎯 ":"☕ "),h("span",{"data-end":String(p.end)},mmss(p.end-now())),p.subj?" · "+p.subj:"");
    return h("div",{class:"row"+(isMe?" me":"")},h("span",{},p.e||"🙂"),h("span",{class:"nm"},(p.n||"؟")+(isMe?" (أنت)":"")),st,
      isMe?null:h("button",{class:"cheer",title:"شجّعه",onclick:function(){cheer(p)}},"👏"));
  }));
}
function renderLB(){
  var t=dayKey(),rows=lb.slice();
  if(lbTab==="today")rows=rows.filter(function(r){return r.day===t&&r.dmin>0}).sort(function(a,b){return b.dmin-a.dmin});
  else rows=rows.filter(function(r){return r.pts>0}).sort(function(a,b){return b.pts-a.pts});
  rows=rows.slice(0,10);
  if(!rows.length){$("lb").replaceChildren(h("div",{class:"empty"},"لسه محدش سجّل مذاكرة"));return}
  var medals=["🥇","🥈","🥉"];
  $("lb").replaceChildren.apply($("lb"),rows.map(function(r,i){
    return h("div",{class:"row"+(me&&r.id===me.id?" me":"")},h("span",{},medals[i]||String(i+1)),h("span",{},r.e||"🙂"),h("span",{class:"nm"},r.n||"؟"),
      h("b",{},lbTab==="today"?r.dmin+" د":r.pts+" ⭐"));
  }));
}
$("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;lbTab=b.dataset.t;
  [].forEach.call($("tabs").children,function(x){x.classList.toggle("on",x===b)});renderLB();
});

/* ---------- الدردشة والتشجيع ---------- */
function addEv(ev){
  if(!ev||typeof ev!=="object")return;
  var box=$("chat"),near=box.scrollHeight-box.scrollTop-box.clientHeight<60,d;
  if(ev.k==="chat")d=h("div",{class:"m"},h("b",{},(ev.e||"")+" "+(ev.n||"؟")+": "),String(ev.t||""));
  else if(ev.k==="cheer"){
    d=h("div",{class:"m sys"},"👏 "+(ev.n||"؟")+" شجّع "+(ev.tn||"؟"));
    if(me&&ev.to===me.id&&now()-ev.ts<15000)toast("👏 "+ev.n+" بيشجّعك! كمّل");
  }else return;
  box.append(d);while(box.children.length>60)box.firstChild.remove();
  if(near)box.scrollTop=box.scrollHeight;
}
function sendMsg(){
  var t=$("msg").value.trim();
  if(!t||!db||Date.now()-lastSend<800)return;
  lastSend=Date.now();$("msg").value="";
  db.ref("events").push({k:"chat",ts:now(),n:me.n,e:me.e,t:t.slice(0,80)}).catch(fail);
}
function cheer(p){
  if(!db||Date.now()-lastCheer<3000)return;lastCheer=Date.now();
  db.ref("events").push({k:"cheer",ts:now(),n:me.n,e:me.e,to:p.id,tn:p.n}).catch(fail);
}
$("send").addEventListener("click",sendMsg);
$("msg").addEventListener("keydown",function(e){if(e.key==="Enter")sendMsg()});

/* ---------- قاعدة البيانات ---------- */
function beat(){
  if(!db||!me||!online)return;
  var run=!!timer;
  db.ref("presence/"+me.id).set({n:me.n,e:me.e,m:run?timer.m:"idle",end:run?timer.end+off:0,subj:run?timer.subj:"",ts:now()})
    .then(function(){if(errMsg){errMsg="";pill()}}).catch(fail);
}
function initDb(){
  if(typeof firebase==="undefined"){errMsg="تعذّر تحميل Firebase";pill();readyRes();return}
  try{firebase.initializeApp(CFG);db=firebase.database()}catch(e){fail(e);readyRes();return}
  db.ref(".info/serverTimeOffset").on("value",function(s){off=s.val()||0});
  db.ref(".info/connected").on("value",function(s){
    online=!!s.val();pill();
    if(online){db.ref("presence/"+me.id).onDisconnect().remove();beat()}
  });
  db.ref("presence").on("value",function(s){peers=s.val()||{};renderRoom()},fail);
  db.ref("users").orderByChild("pts").limitToLast(50).on("value",function(s){
    lb=[];s.forEach(function(c){lb.push(Object.assign({id:c.key},c.val()))});renderLB();
  },fail);
  db.ref("events").limitToLast(40).on("child_added",function(s){addEv(s.val())},fail);
  db.ref("users/"+me.id).once("value").then(function(s){
    var v=s.val();if(v)Object.keys(prof).forEach(function(k){if(v[k]!==undefined)prof[k]=v[k]});
    readyRes();renderStats();
  }).catch(function(e){fail(e);readyRes()});
}

/* ---------- التشغيل ---------- */
function boot(){
  $("reg").classList.add("hide");$("app").classList.remove("hide");$("top").classList.remove("hide");
  $("who").textContent=me.e+" "+me.n;
  if(timer&&Date.now()-timer.end>120000){timer=null;ls.set("sr2_timer",null)}
  if(timer)$("subj").value=timer.subj||"";
  renderStats();renderTimer();renderLB();renderRoom();
  initDb();
  setInterval(tick,500);setInterval(beat,20000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden){tick();beat()}});
  window.addEventListener("pageshow",function(){beat()});
  window.addEventListener("online",function(){beat()});
  window.addEventListener("pagehide",function(){if(db&&me)try{db.ref("presence/"+me.id).remove()}catch(e){}});
}
MODES.forEach(function(m){
  $("modes").append(h("button",{type:"button","data-m":m[0],"data-d":String(m[1]),onclick:function(){sel={m:m[0],dur:m[1]};renderTimer()}},(m[0]==="focus"?"تركيز ":"راحة ")+m[1]));
});
$("go").addEventListener("click",startTimer);
$("stop").addEventListener("click",stopTimer);
$("who").addEventListener("click",function(){
  var n=prompt("اسمك المستعار الجديد:",me.n);if(n==null)return;
  n=n.trim().replace(/\s+/g," ").slice(0,14);if(n.length<2)return;
  me.n=n;ls.set("sr2_me",me);$("who").textContent=me.e+" "+me.n;save();beat();
});
renderTimer();
if(me)boot();
})();
</script>
